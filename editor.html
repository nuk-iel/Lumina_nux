<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Luminati Level Editor</title>
  <meta name="description" content="Luminati Level Editor — paint terrain, place buildings, lights and villagers, and play-test 2.5D pixel-art levels." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' rx='3' fill='%231a2238'/%3E%3Cpath fill='%23304066' d='M2 11h12v3H2z'/%3E%3Cpath fill='%23c9a45c' d='M7 2h2v1h1v2h1v2h1v4h-1v1h-1v1H6v-1H5v-1H4V7h1V5h1V3h1z'/%3E%3Cpath fill='%23f59a2e' d='M7 5h2v2h1v3H9v1H7v-1H6V7h1z'/%3E%3Cpath fill='%23fff6d0' d='M7 8h2v2H7z'/%3E%3C/svg%3E" />
  <style>
    /* boot splash (replaced once the editor is built) */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
    #editor { position: fixed; inset: 0; }
    .le-boot { position: fixed; inset: 0; display: grid; place-items: center; color: #c9a45c; font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; background: radial-gradient(ellipse at 50% 45%, #1a2238 0%, #0b1020 70%); }
    .le-boot i { display: block; width: 120px; height: 2px; margin: 14px auto 0; background: linear-gradient(90deg, transparent, #c9a45c, transparent); animation: le-boot 1.2s ease-in-out infinite; }
    @keyframes le-boot { 50% { opacity: .25; } }
    .le-boot-error { max-width: 560px; padding: 0 24px; text-align: center; letter-spacing: normal; text-transform: none; }
    .le-boot-error b { display: block; margin-bottom: 8px; color: #ec7065; font-size: 15px; }
    .le-boot-error span { color: #a4adc6; font-weight: 400; }
    :lang(zh-Hans) .le-boot { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; letter-spacing: .12em; }
  </style>
</head>
<body>
  <div id="editor"><div class="le-boot"><div><span class="le-boot-title">Luminati Level Editor</span><i></i></div></div></div>
  <noscript>The Luminati Level Editor needs JavaScript. / Luminati 关卡编辑器需要启用 JavaScript。</noscript>
  <script>
    // The splash and the load-failure text in the UI language (the same choice src/editor/i18n.js
    // makes: ?lang=, then the saved luminati.lang; the editor shows English or Chinese).
    var LE_BOOT_ZH = (function () {
      var lang = '';
      try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('luminati.lang') || ''; } catch (e) { /* storage off */ }
      return /^zh/i.test(lang);
    })();
    if (LE_BOOT_ZH) {
      document.documentElement.lang = 'zh-Hans';
      document.querySelector('#editor .le-boot-title').textContent = 'Luminati 关卡编辑器';
    }
    // If the editor code cannot load at all (a failed import, a syntax error), say so instead of
    // leaving the boot splash up forever. Errors after the editor has been built are left alone.
    (function () {
      function fail(msg) {
        var boot = document.querySelector('#editor .le-boot');
        if (!boot) return;
        boot.innerHTML = '<div class="le-boot-error"><b></b><span></span></div>';
        boot.querySelector('b').textContent = LE_BOOT_ZH ? '关卡编辑器无法加载' : 'The level editor could not load';
        boot.querySelector('span').textContent = String(msg || (LE_BOOT_ZH ? '未知错误' : 'Unknown error')) + (LE_BOOT_ZH ? ' —— 详情请查看浏览器控制台。' : ' — see the browser console for details.');
      }
      window.__leBootFail = fail;
      window.addEventListener('error', function (e) { fail(e && (e.message || (e.target && e.target.src && 'Failed to load ' + e.target.src))); }, true);
    })();
  </script>
  <script type="module" src="./src/editor/main.js" onerror="window.__leBootFail && window.__leBootFail('Failed to load the editor module')"></script>
</body>
</html>
